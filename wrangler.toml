# Cloudflare Pages + Functions configuration for LiteralMemories.
#
# Most build settings live in the Cloudflare Pages dashboard (project name,
# build command, branch deploy hooks). This file pins runtime compatibility
# so deploys don't drift if Cloudflare updates defaults.
#
# Env vars are set in the Cloudflare Pages dashboard, never in this file.

name = "literalmemories"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

# IMPORTANT: this property is what tells Cloudflare to read this file as
# Pages config. Without it, the whole file is ignored and the compat flag
# above doesn't take effect.
pages_build_output_dir = "./dist/public"
